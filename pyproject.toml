[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convint"
version = "0.1.0"
description = "Conversational-intelligence component: interview depth-gating, decision-first."
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
providers = ["anthropic>=0.40", "openai>=1.50"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=2.1"]

[project.scripts]
convint = "convint.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live and not e2e'"
markers = [
  "live: hits a real model API; deselected by default",
  "e2e: starts a real server and a Node client; deselected by default",
]
