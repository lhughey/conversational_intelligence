# Offline only: no secrets, no API keys, no live tests, no .env.
# tests/conftest.py pins every non-live test to the model-free engine and
# blocks sockets, so nothing here can reach a model API.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Offline suite with coverage floor
        run: pytest --cov=convint --cov-report=term --cov-fail-under=88

      - name: Cross-language e2e (Node client vs live HTTP server)
        run: pytest -m e2e -v

      - name: Contract drift
        run: |
          python scripts/export_contracts.py
          git diff --exit-code contracts/
